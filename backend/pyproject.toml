[project]
name = "mogo-server"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "openai>=1.40",
  "pyyaml>=6",
  "sentry-sdk>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["mogo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
