# One entry per repo the agent may review. `name` must match the owner/repo in the PR URL (case-insensitive).
# Values below were read from each repo's `main` branch (package.json, CLAUDE.md, .env.example, docker-compose).
#
# Order of a run: setup -> gates -> (if a feature is given and `start` is set) services_cmd -> start -> agent -> services_down.
# Commands run with a scrubbed environment: only PATH, HOME, CI and the `env:` / `env_from:` of that repo.
# Everything in `env:` must be a throwaway test value, never a real secret. Secrets go in `env_from:`.
repos:
  # ---------------------------------------------------------------- backend
  - name: antrotrip/antrotrip-server
    setup:
      - corepack enable
      - pnpm install --frozen-lockfile
    gates:
      - pnpm lint
      - pnpm format:check
      - pnpm exec prisma generate && pnpm exec tsc --noEmit
    # The repo has no automated test runner (test/ only holds JSON fixtures), so there is no test_cmd.
    # The agent verifies features by calling the running API and reading the development database.
    # Postgres is remote (ANTROTRIP_SERVER_DATABASE_URL); only Valkey runs locally.
    # Docker Hub pulls from Actions time out now and then, so the pull is retried before giving up.
    services_cmd: >-
      docker rm -f mogo-valkey >/dev/null 2>&1;
      for i in 1 2 3 4; do docker pull -q valkey/valkey:8 && break; echo "pull failed, retry $i"; sleep $((i * 5)); done;
      docker run -d --rm --name mogo-valkey -p 6379:6379 valkey/valkey:8
      && for j in $(seq 30); do docker exec mogo-valkey valkey-cli ping >/dev/null 2>&1 && break; sleep 1; done
    services_down: docker rm -f mogo-valkey
    # DATABASE_URL is the shared development database: mogo never migrates, seeds or resets it.
    # A PR that adds a Prisma migration therefore runs against the old schema; the agent reports that as unverified.
    prepare:
      - pnpm exec prisma generate
    start: pnpm dev
    healthcheck: http://localhost:8000/api/v1/health
    # Plain, non-secret settings (committed). Values are quoted: env vars are strings, and bare `on` is a YAML boolean.
    env:
      GUARDRAIL_REASONING_EFFORT: "low"
      GUARDRAIL_INPUT_MODE: "enforce"
      GUARDRAIL_OUTPUT_MODE: "enforce"
      AGENT_DAILY_TOKEN_BUDGET: "200000"
      AGENT_APPROVAL_TTL_MINUTES: "30"
      AGENT_MEMORY_EXTRACTION: "on"
      AGENT_TRIP_CREATOR: "on"
      AGENT_PLANNING_MODE: "on"
      AGENT_PLAN_TOKEN_CAP: "150000"
      AGENT_PLAN_IDLE_DAYS: "7"
      JWT_ACCESS_TOKEN_VALIDITY_MINUTES: "30"
      JWT_REFRESH_TOKEN_VALIDITY_MINUTES: "1440"
      SMTP_HOST: "localhost"
      SMTP_PORT: "1025"
      SMTP_FROM: "noreply@antrotrip.com"
      OTP_EXPIRY_SECONDS: "300"
      OTP_RESEND_COOLDOWN_SECONDS: "180"
      OTP_LENGTH: "6"
      PMTILES_FILE: "intl.pmtiles"
    # Everything else comes from the runner repo's Actions secrets (Settings > Secrets and variables > Actions),
    # as <name in the app>: <secret name>. Only secret names go here, never values. The ANTROTRIP_SERVER_ prefix keeps
    # them apart from the runner's own DATABASE_URL. The PR's code can read every value.
    # Expected values: PORT=8000 (matches healthcheck), VALKEY_HOST=localhost, VALKEY_PORT=6379 (local mogo-valkey).
    env_from:
      NODE_ENV: ANTROTRIP_SERVER_NODE_ENV
      PORT: ANTROTRIP_SERVER_PORT
      LOG_LEVEL: ANTROTRIP_SERVER_LOG_LEVEL

      SUPER_ADMIN_EMAIL: ANTROTRIP_SERVER_SUPER_ADMIN_EMAIL
      SUPER_ADMIN_PASSWORD: ANTROTRIP_SERVER_SUPER_ADMIN_PASSWORD

      SERVER_BASE_URL: ANTROTRIP_SERVER_BASE_URL
      AI_SERVER_BASE_URL: ANTROTRIP_AI_SERVER_BASE_URL

      DATABASE_URL: ANTROTRIP_SERVER_DATABASE_URL

      LLM_MODE: ANTROTRIP_SERVER_LLM_MODE

      LLM_BASE_URL: ANTROTRIP_SERVER_LLM_BASE_URL
      LLM_API_KEY: ANTROTRIP_SERVER_LLM_API_KEY
      LLM_CHAT_MODEL: ANTROTRIP_SERVER_LLM_CHAT_MODEL

      LLM_REASONING_EFFORT: ANTROTRIP_SERVER_LLM_REASONING_EFFORT
      LLM_EMBEDDING_MODEL: ANTROTRIP_SERVER_LLM_EMBEDDING_MODEL

      GUARDRAIL_MODEL: ANTROTRIP_SERVER_GUARDRAIL_MODEL

      VALKEY_HOST: ANTROTRIP_SERVER_VALKEY_HOST
      VALKEY_PORT: ANTROTRIP_SERVER_VALKEY_PORT

      JWT_ACCESS_TOKEN_SECRET: ANTROTRIP_SERVER_JWT_ACCESS_TOKEN_SECRET
      JWT_REFRESH_TOKEN_SECRET: ANTROTRIP_SERVER_JWT_REFRESH_TOKEN_SECRET

      ANTROTRIP_SERVER_SECRET: ANTROTRIP_SERVER_SERVER_SECRET
      ANTROTRIP_AI_SERVER_SECRET: ANTROTRIP_SERVER_AI_SERVER_SECRET

      GOOGLE_CLIENT_ID: ANTROTRIP_SERVER_GOOGLE_CLIENT_ID
      GOOGLE_CLIENT_SECRET: ANTROTRIP_SERVER_GOOGLE_CLIENT_SECRET
      GOOGLE_CALLBACK_URL: ANTROTRIP_SERVER_GOOGLE_CALLBACK_URL
      GOOGLE_CALLBACK_FRONTEND_URL: ANTROTRIP_SERVER_GOOGLE_CALLBACK_FRONTEND_URL

      AWS_S3_BUCKET: ANTROTRIP_SERVER_AWS_S3_BUCKET
      AWS_S3_REGION: ANTROTRIP_SERVER_AWS_S3_REGION
      AWS_ACCESS_KEY_ID: ANTROTRIP_SERVER_AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: ANTROTRIP_SERVER_AWS_SECRET_ACCESS_KEY

      GOOGLE_MAPS_API_KEY: ANTROTRIP_SERVER_GOOGLE_MAPS_API_KEY
      BARIKOI_MAPS_API_KEY: ANTROTRIP_SERVER_BARIKOI_MAPS_API_KEY

      EXCHANGE_RATE_API_KEY: ANTROTRIP_SERVER_EXCHANGE_RATE_API_KEY
      FRONTEND_BASE_URL: ANTROTRIP_SERVER_FRONTEND_BASE_URL
    conventions:
      - CLAUDE.md
      - .claude/skills/new-trpc-module/SKILL.md
    notes: |
      DATABASE_URL points at the shared DEVELOPMENT database, not a sandbox. It is not seeded or reset by mogo.
      Prefer reading. When a feature needs data, create the minimum, give it an obvious name/email containing
      "mogo-test", and delete what you created when done. Never truncate, drop, migrate or bulk-update anything.
      Valkey runs locally on localhost:6379 (container mogo-valkey), empty at start.

      App users are passwordless. Pick an existing user from the database (or sign up a new mogo-test address),
      arm a code in the local Valkey with
        docker exec mogo-valkey valkey-cli set otp:email:<address> 111111 EX 3600
      then log in with
        POST http://localhost:8000/api/v1/auth/email/verify-otp  {"email": "<address>", "otp": "111111"}
      and send the returned accessToken as "Authorization: Bearer <accessToken>". A code is single use; re-arm it.
      Admin login: POST /api/v1/admins/auth/login with $SUPER_ADMIN_EMAIL / $SUPER_ADMIN_PASSWORD, if that admin exists.

      A PR that adds a Prisma migration runs against the old schema (migrations are not applied); report it as unverified.

  # ---------------------------------------------------------------- web client (Next.js 16)
  - name: antrotrip/antrotrip-client
    setup:
      - corepack enable
      - pnpm install --frozen-lockfile
    gates:
      - pnpm lint
      - pnpm format:check
      # `next typegen` creates .next/types, which tsconfig.json includes
      - pnpm exec next typegen && pnpm exec tsc --noEmit
    # Review-only: no `start`, so UI behaviour is reported as unverified (the backend is where features are tested).
    env:
      NEXT_PUBLIC_SERVER_API_BASE_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    conventions:
      - CLAUDE.md
      - AGENTS.md

  # ---------------------------------------------------------------- admin client (Vite + React)
  # Transferred to the antrotrip org (the old JanayAlam/ URL still redirects, but PR links use antrotrip/).
  - name: antrotrip/antrotrip-admin-client
    setup:
      - corepack enable
      - pnpm install --frozen-lockfile
    gates:
      - pnpm lint
      - pnpm format:check
      - pnpm exec tsc -b
    env:
      VITE_SERVER_API_BASE_URL: http://localhost:8000
      VITE_API_PREFIX: /api/v1
    conventions:
      - CLAUDE.md
