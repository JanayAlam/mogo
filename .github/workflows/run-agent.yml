name: run-agent
# Dispatched by the mogo API when EXECUTION_MODE=actions.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: mogo run id (row in the runs table)
        required: true

concurrency:
  group: mogo-${{ inputs.run_id }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e backend
      # Names only, never values: says which settings reached the job and which sit in the wrong tab.
      - name: Check configuration
        env:
          S_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN != '' }}
          S_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
          S_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY != '' }}
          S_LOCAL_LLM_BASE_URL: ${{ secrets.LOCAL_LLM_BASE_URL != '' }}
          V_GITHUB_TOKEN: ${{ vars.GITHUB_TOKEN != '' }}
          V_DATABASE_URL: ${{ vars.DATABASE_URL != '' }}
          V_DEEPSEEK_API_KEY: ${{ vars.DEEPSEEK_API_KEY != '' }}
          V_LOCAL_LLM_BASE_URL: ${{ vars.LOCAL_LLM_BASE_URL != '' }}
        run: |
          missing=0
          for n in GITHUB_TOKEN DATABASE_URL DEEPSEEK_API_KEY LOCAL_LLM_BASE_URL; do
            s="S_$n"; v="V_$n"
            if [ "${!s}" = "true" ]; then echo "ok       secret $n"
            elif [ "${!v}" = "true" ]; then echo "::error::$n is under the Variables tab; move it to the Secrets tab"; missing=1
            else echo "missing  secret $n"; fi
          done
          [ "$S_DATABASE_URL" = "true" ] && [ "$S_GITHUB_TOKEN" = "true" ] || { echo "::error::DATABASE_URL and GITHUB_TOKEN must be repository secrets (Settings > Secrets and variables > Actions > Secrets)"; missing=1; }
          exit $missing
      - name: Run agent
        working-directory: backend
        env:
          RUN_ID: ${{ inputs.run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Optional: a tunnel URL (Tailscale / cloudflared) to your local LLM server.
          LOCAL_LLM_BASE_URL: ${{ secrets.LOCAL_LLM_BASE_URL }}
          LOCAL_LLM_MODEL: ${{ vars.LOCAL_LLM_MODEL || secrets.LOCAL_LLM_MODEL }}
          # Every Actions secret, as JSON. The runner forwards only the names a repo lists under `env_from`
          # in repos.yaml (test keys for the code under test). Add such secrets in Settings > Secrets.
          MOGO_SECRETS_JSON: ${{ toJSON(secrets) }}
          ENVIRONMENT: actions
          REPOS_FILE: ../repos.yaml
        run: python -m mogo.runner "$RUN_ID"
