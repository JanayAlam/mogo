name: run-agent
# Dispatched by the mogo API when EXECUTION_MODE=actions.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: mogo run id (row in the runs table)
        required: false
      profile_repo_id:
        description: re-learn this repo's conventions instead of running a review
        required: false

concurrency:
  group: mogo-${{ inputs.run_id || inputs.profile_repo_id }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e backend
      # Names only, never values: says which settings reached the job and which sit in the wrong tab.
      - name: Check configuration
        env:
          S_MOGO_APP_ID: ${{ secrets.MOGO_APP_ID != '' }}
          S_MOGO_APP_PRIVATE_KEY: ${{ secrets.MOGO_APP_PRIVATE_KEY != '' }}
          S_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
          S_MOGO_SECRET_KEY: ${{ secrets.MOGO_SECRET_KEY != '' }}
          V_MOGO_APP_ID: ${{ vars.MOGO_APP_ID != '' }}
          V_MOGO_APP_PRIVATE_KEY: ${{ vars.MOGO_APP_PRIVATE_KEY != '' }}
          V_DATABASE_URL: ${{ vars.DATABASE_URL != '' }}
          V_MOGO_SECRET_KEY: ${{ vars.MOGO_SECRET_KEY != '' }}
        run: |
          missing=0
          for n in MOGO_APP_ID MOGO_APP_PRIVATE_KEY DATABASE_URL MOGO_SECRET_KEY; do
            s="S_$n"; v="V_$n"
            if [ "${!s}" = "true" ]; then echo "ok       secret $n"
            elif [ "${!v}" = "true" ]; then echo "::error::$n is under the Variables tab; move it to the Secrets tab"; missing=1
            else echo "::error::$n must be a repository secret (Settings > Secrets and variables > Actions > Secrets)"; missing=1; fi
          done
          exit $missing
      - name: Run agent
        working-directory: backend
        env:
          RUN_ID: ${{ inputs.run_id }}
          PROFILE_REPO_ID: ${{ inputs.profile_repo_id }}
          # The Mogo GitHub App: per-repo tokens to read the PR and post the review as mogo[bot].
          # (Actions names cannot start with GITHUB_, hence MOGO_APP_* here.)
          GITHUB_APP_ID: ${{ secrets.MOGO_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.MOGO_APP_PRIVATE_KEY }}
          GITHUB_APP_SLUG: ${{ vars.MOGO_APP_SLUG }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Decrypts repo secrets and users' LLM keys entered in the web app; same value as MOGO_SECRET_KEY on Vercel.
          MOGO_SECRET_KEY: ${{ secrets.MOGO_SECRET_KEY }}
          ENVIRONMENT: actions
        run: |
          if [ -n "$PROFILE_REPO_ID" ]; then python -m mogo.runner --profile "$PROFILE_REPO_ID"
          else python -m mogo.runner "$RUN_ID"; fi
